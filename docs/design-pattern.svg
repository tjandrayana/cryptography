<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#2d3748"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a202c">
    Factory Pattern Architecture
  </text>
  <text x="450" y="55" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#718096">
    Cryptography Library Design
  </text>
  
  <!-- Client Code -->
  <rect x="250" y="80" width="400" height="60" rx="8" fill="#4299e1" stroke="#2b6cb0" stroke-width="2"/>
  <text x="450" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Client Application
  </text>
  <text x="450" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Uses Cryptography Interface
  </text>
  
  <!-- Arrow Client to Interface -->
  <line x1="450" y1="140" x2="450" y2="180" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="470" y="165" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">uses</text>
  
  <!-- Interface -->
  <rect x="200" y="180" width="500" height="130" rx="8" fill="#48bb78" stroke="#2f855a" stroke-width="2"/>
  <text x="450" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    Cryptography Interface
  </text>
  <rect x="220" y="225" width="460" height="70" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="230" y="245" font-family="'Courier New', monospace" font-size="11" fill="white">Encrypt(data, opts...) → string</text>
  <text x="230" y="265" font-family="'Courier New', monospace" font-size="11" fill="white">Decrypt(ciphertext, key...) → interface{}</text>
  <text x="230" y="285" font-family="'Courier New', monospace" font-size="11" fill="white">Verify(data, hash) → bool</text>
  
  <!-- Arrow Interface to Modules -->
  <line x1="450" y1="310" x2="450" y2="350" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="470" y="335" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">implements</text>
  
  <!-- Modules -->
  <!-- AES Module -->
  <rect x="50" y="350" width="240" height="110" rx="8" fill="#f56565" stroke="#c53030" stroke-width="2"/>
  <text x="170" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    AES Module
  </text>
  <text x="170" y="405" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    AES-256-GCM
  </text>
  <text x="170" y="425" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Symmetric Encryption
  </text>
  <text x="170" y="445" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">
    Authenticated &amp; Secure
  </text>
  
  <!-- JWT Module -->
  <rect x="330" y="350" width="240" height="110" rx="8" fill="#9f7aea" stroke="#805ad5" stroke-width="2"/>
  <text x="450" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    JWT Module
  </text>
  <text x="450" y="405" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    HMAC-SHA256
  </text>
  <text x="450" y="425" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Token-based
  </text>
  <text x="450" y="445" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">
    TTL Support
  </text>
  
  <!-- Hash Module -->
  <rect x="610" y="350" width="240" height="110" rx="8" fill="#ed8936" stroke="#c05621" stroke-width="2"/>
  <text x="730" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Hash Module
  </text>
  <text x="730" y="405" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    SHA-256/512
  </text>
  <text x="730" y="425" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Bcrypt
  </text>
  <text x="730" y="445" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.9)">
    One-way Hashing
  </text>
  
  <!-- Arrows from Interface to Modules -->
  <line x1="280" y1="310" x2="170" y2="350" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="310" x2="450" y2="350" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="620" y1="310" x2="730" y2="350" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow Modules to Factory -->
  <line x1="170" y1="460" x2="170" y2="500" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="460" x2="450" y2="500" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="730" y1="460" x2="730" y2="500" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="450" y="485" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4a5568">created by</text>
  
  <!-- Factory -->
  <rect x="150" y="500" width="600" height="90" rx="8" fill="#fbbf24" stroke="#d69e2e" stroke-width="2"/>
  <text x="450" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a202c">
    Factory Function
  </text>
  <rect x="170" y="545" width="560" height="30" rx="4" fill="rgba(26,32,44,0.1)"/>
  <text x="180" y="565" font-family="'Courier New', monospace" font-size="12" font-weight="600" fill="#1a202c">NewModule(ModuleType, key)</text>
  <text x="450" y="585" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4a5568">
    ModuleTypeAES • ModuleTypeJWT • ModuleTypeHash
  </text>
</svg>
